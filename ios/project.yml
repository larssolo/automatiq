# XcodeGen spec: `xcodegen generate` (run in ios/) writes TextFox.xcodeproj. The .xcodeproj is
# generated and not committed; change targets and settings here.
name: TextFox
options:
  bundleIdPrefix: app.kodekid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TextFoxCore:
    path: Packages/TextFoxCore
targets:
  TextFox:
    type: application
    platform: iOS
    sources: [TextFox]
    dependencies:
      - package: TextFoxCore
      - target: TextFoxWidget
        embed: true
    entitlements:
      path: TextFox/TextFox.entitlements
      properties:
        com.apple.security.application-groups: [group.app.kodekid.textfox]
    info:
      path: TextFox/Info.plist
      properties:
        CFBundleDisplayName: TextFox
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSContactsUsageDescription: TextFox shows your contacts' names next to the numbers in your macros.
        NSLocationWhenInUseUsageDescription: TextFox uses your location only for macros that send when you arrive at or leave a place.
        NSLocationAlwaysAndWhenInUseUsageDescription: TextFox uses your location only for macros that send when you arrive at or leave a place, also while the app is closed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kodekid.textfox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TextFoxWidget:
    type: app-extension
    platform: iOS
    sources: [TextFoxWidget]
    dependencies:
      - package: TextFoxCore
    entitlements:
      path: TextFoxWidget/TextFoxWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.kodekid.textfox]
    info:
      path: TextFoxWidget/Info.plist
      properties:
        CFBundleDisplayName: TextFox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kodekid.textfox.widget
schemes:
  TextFox:
    build:
      targets:
        TextFox: all
    test:
      targets: []
